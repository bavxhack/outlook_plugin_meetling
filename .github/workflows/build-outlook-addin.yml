name: Outlook-Add-in erstellen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outlook-addin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Kernlogik testen
    runs-on: windows-2022
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET SDK 8 bereitstellen
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: MSBuild bereitstellen
        uses: microsoft/setup-msbuild@v2

      - name: Tests wiederherstellen und kompilieren
        shell: pwsh
        run: >-
          msbuild tests\Meetling.Core.Tests\Meetling.Core.Tests.csproj
          /restore /t:Rebuild /m /verbosity:minimal
          /p:Configuration=$env:CONFIGURATION
          /p:ContinuousIntegrationBuild=true
          /p:RestoreIgnoreFailedSources=false

      - name: Tests ausführen
        shell: pwsh
        run: |
          $testExecutable = "tests\Meetling.Core.Tests\bin\$env:CONFIGURATION\net48\Meetling.Core.Tests.exe"
          if (-not (Test-Path $testExecutable)) {
              throw "Testprogramm wurde nicht erzeugt: $testExecutable"
          }
          & $testExecutable
          if ($LASTEXITCODE -ne 0) {
              throw "Tests sind mit Exitcode $LASTEXITCODE fehlgeschlagen."
          }

  build:
    name: DLL für ${{ matrix.architecture }}
    needs: test
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET SDK 8 bereitstellen
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: MSBuild bereitstellen
        uses: microsoft/setup-msbuild@v2

      - name: Add-in wiederherstellen und bauen
        shell: pwsh
        run: >-
          msbuild src\Meetling.OutlookAddIn\Meetling.OutlookAddIn.csproj
          /restore /t:Rebuild /m /verbosity:minimal
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=${{ matrix.architecture }}
          /p:ContinuousIntegrationBuild=true
          /p:RestoreIgnoreFailedSources=false

      - name: Installationspaket erstellen und prüfen
        shell: pwsh
        run: |
          $source = "src\Meetling.OutlookAddIn\bin\${{ matrix.architecture }}\$env:CONFIGURATION\net48"
          $packageName = "Meetling-OutlookAddIn-${{ matrix.architecture }}"
          $package = Join-Path "artifacts" $packageName
          $requiredBuildFiles = @(
              "Meetling.OutlookAddIn.dll",
              "Meetling.Core.dll"
          )

          foreach ($file in $requiredBuildFiles) {
              $path = Join-Path $source $file
              if (-not (Test-Path $path)) {
                  throw "Erforderliche Build-Datei fehlt: $path"
              }
          }

          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item (Join-Path $source '*.dll') $package -Force
          Copy-Item (Join-Path $source '*.pdb') $package -Force -ErrorAction SilentlyContinue
          Copy-Item installer\Install-PublishedAddIn.ps1 (Join-Path $package 'Install.ps1') -Force
          Copy-Item installer\Uninstall-AddIn.ps1 (Join-Path $package 'Uninstall.ps1') -Force
          Copy-Item README.md $package -Force

          Get-FileHash (Join-Path $package '*.dll') -Algorithm SHA256 |
              Sort-Object Path |
              ForEach-Object { "{0} *{1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } |
              Set-Content (Join-Path $package 'SHA256SUMS.txt') -Encoding ASCII

          $archive = Join-Path 'artifacts' "$packageName.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -Force
          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -eq 0) {
              throw "Release-Archiv wurde nicht korrekt erzeugt: $archive"
          }

      - name: DLL-Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Meetling-OutlookAddIn-${{ matrix.architecture }}
          path: |
            artifacts/Meetling-OutlookAddIn-${{ matrix.architecture }}/
            artifacts/Meetling-OutlookAddIn-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Download-Release veröffentlichen
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref_name == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: DLL-Pakete herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: Meetling-OutlookAddIn-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Release-Pakete prüfen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-artifacts -type f -name 'Meetling-OutlookAddIn-*.zip' -exec cp '{}' release-assets/ \;
          test -f release-assets/Meetling-OutlookAddIn-x86.zip
          test -f release-assets/Meetling-OutlookAddIn-x64.zip
          unzip -t release-assets/Meetling-OutlookAddIn-x86.zip
          unzip -t release-assets/Meetling-OutlookAddIn-x64.zip

      - name: Versioniertes oder fortlaufendes Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release upload "$release_tag" release-assets/*.zip --clobber
            else
              gh release create "$release_tag" release-assets/*.zip \
                --verify-tag \
                --generate-notes \
                --title "Meetling Outlook Add-in $release_tag"
            fi
          else
            release_tag="continuous"
            gh release delete "$release_tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$release_tag" >/dev/null 2>&1 || true
            gh release create "$release_tag" release-assets/*.zip \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Meetling Outlook Add-in – aktueller Build" \
              --notes "Automatisch geprüfter Build aus Commit $GITHUB_SHA. Für Outlook 32-Bit das x86-Paket, für Outlook 64-Bit das x64-Paket herunterladen."
          fi

          echo "### Release verfügbar" >> "$GITHUB_STEP_SUMMARY"
          echo "[Meetling Outlook Add-in herunterladen]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag)" >> "$GITHUB_STEP_SUMMARY"
